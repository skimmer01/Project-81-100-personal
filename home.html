<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>Project 0 → 100</title>
<style>html,body{margin:0;width:100%;height:100%;background:#090b0f;overflow:hidden}#shell{display:block;width:100%;height:100dvh;border:0;background:#090b0f}</style>
</head>
<body>
<iframe id="shell" src="/index.html?embedded=1" title="Project 0 → 100"></iframe>
<script>
const shell=document.getElementById('shell');
const KEY='project0100_v4';
const SEED='gambling_seed_7_2026_09_14';
function readState(w){try{return JSON.parse(w.localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function writeState(w,s){w.localStorage.setItem(KEY,JSON.stringify(s))}
function install(){
  const outer=shell.contentDocument;if(!outer)return;
  const app=outer.getElementById('app');if(!app)return;
  const inject=()=>{
    const d=app.contentDocument,w=app.contentWindow;if(!d||!w)return;
    let state=readState(w);
    if(!w.localStorage.getItem(SEED)){
      if(Number(state.gambling||0)<7)state.gambling=7;
      state.streakCheckins=state.streakCheckins||{};
      writeState(w,state);
      w.localStorage.setItem(SEED,'1');
      setTimeout(()=>app.contentWindow.location.reload(),30);
      return;
    }
    function today(){const x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
    function commit(mutator){const s=readState(w);mutator(s);writeState(w,s);app.contentWindow.location.reload();}
    w.markGamblingFreeToday=function(){commit(s=>{s.streakCheckins=s.streakCheckins||{};const t=today();s.streakCheckins[t]=s.streakCheckins[t]||{};if(!s.streakCheckins[t].gambling){s.streakCheckins[t].gambling=true;s.gambling=Number(s.gambling||0)+1;}});};
    w.undoGamblingToday=function(){commit(s=>{s.streakCheckins=s.streakCheckins||{};const t=today();s.streakCheckins[t]=s.streakCheckins[t]||{};if(s.streakCheckins[t].gambling){s.streakCheckins[t].gambling=false;s.gambling=Math.max(0,Number(s.gambling||0)-1);}});};
    w.resetGamblingStreak=function(){if(!w.confirm('Reset your gambling-free streak to 0?'))return;commit(s=>{s.gambling=0;s.streakCheckins=s.streakCheckins||{};const t=today();s.streakCheckins[t]=s.streakCheckins[t]||{};s.streakCheckins[t].gambling=false;});};

    w.toggleWolfieWalk=function(period){commit(s=>{const t=today();s.wolfieWalksByDate=s.wolfieWalksByDate||{};s.wolfieWalksByDate[t]=s.wolfieWalksByDate[t]||{am:false,pm:false};s.wolfieWalksByDate[t][period]=!s.wolfieWalksByDate[t][period];s.anchorsByDate=s.anchorsByDate||{};s.anchorsByDate[t]=s.anchorsByDate[t]||{wolfie:false,workout:false,nutrition:false};s.anchorsByDate[t].wolfie=!!(s.wolfieWalksByDate[t].am&&s.wolfieWalksByDate[t].pm);});};
    w.chooseWorkoutType=function(type){commit(s=>{const t=today();s.workoutChoiceByDate=s.workoutChoiceByDate||{};s.workoutOtherByDate=s.workoutOtherByDate||{};const before=(s.workoutChoiceByDate[t]||'');let other='';if(type==='other'){other=w.prompt('What are you doing today?','')||'';if(!other.trim())return;}s.workoutChoiceByDate[t]=(before===type?'':type);if(type==='other'&&s.workoutChoiceByDate[t])s.workoutOtherByDate[t]=other.trim();s.anchorsByDate=s.anchorsByDate||{};s.anchorsByDate[t]=s.anchorsByDate[t]||{wolfie:false,workout:false,nutrition:false};const wasDone=!!s.anchorsByDate[t].workout;s.anchorsByDate[t].workout=!!s.workoutChoiceByDate[t];if(!wasDone&&s.anchorsByDate[t].workout)s.training=Number(s.training||0)+1;if(wasDone&&!s.anchorsByDate[t].workout)s.training=Math.max(0,Number(s.training||0)-1);});};

    function drawGambling(){
      const s=readState(w),days=d.getElementById('gambleDays');if(!days)return;
      const n=Number(s.gambling||0);days.textContent=n;
      const bar=d.getElementById('gambleBar');if(bar)bar.style.width=Math.min(100,n/90*100)+'%';
      const sg=d.getElementById('streakGambling');if(sg)sg.textContent=n+' days';
      const card=days.closest('.card');if(!card)return;
      let box=d.getElementById('gamblingQuickControls');if(!box){box=d.createElement('div');box.id='gamblingQuickControls';card.appendChild(box);}
      const protectedToday=!!((((s.streakCheckins||{})[today()]||{}).gambling));
      box.innerHTML='<div style="font-size:11px;margin-top:9px;font-weight:800;color:'+(protectedToday?'#63e6a6':'#97a1ad')+'">'+(protectedToday?'Today: ✅ Protected':'Current streak: '+n+' days')+'</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">'+
      '<button class="btn '+(protectedToday?'good':'secondary')+' sm" onclick="markGamblingFreeToday()">'+(protectedToday?'✓ Added today':'✅ Gambling-Free Today')+'</button>'+
      '<button class="btn ghost sm" onclick="undoGamblingToday()">↩ Undo Today</button></div>'+
      '<button class="btn ghost sm" style="width:100%;margin-top:6px;font-size:10px" onclick="resetGamblingStreak()">Reset streak</button>';
    }

    function drawAnchors(){
      const s=readState(w),t=today();
      const walks=((s.wolfieWalksByDate||{})[t])||{am:false,pm:false};
      const choice=((s.workoutChoiceByDate||{})[t])||'';
      const other=((s.workoutOtherByDate||{})[t])||'';
      const grid=d.getElementById('anchorGrid');if(!grid)return;
      const cards=grid.querySelectorAll('.anchor');if(cards.length<2)return;
      cards[0].innerHTML='<div style="font-size:25px">🐺</div><div class="small" style="font-weight:800;margin-bottom:8px">Walk Wolfie</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="btn '+(walks.am?'good':'secondary')+' sm" onclick="toggleWolfieWalk(\'am\')">'+(walks.am?'✓ AM':'☀️ AM')+'</button><button class="btn '+(walks.pm?'good':'secondary')+' sm" onclick="toggleWolfieWalk(\'pm\')">'+(walks.pm?'✓ PM':'🌙 PM')+'</button></div><div class="small" style="margin-top:7px">'+(walks.am&&walks.pm?'2/2 complete ✓':((walks.am||walks.pm)?'1/2 complete':'0/2 today'))+'</div>';
      const opts=[['kayaking','🛶','Kayaking'],['workout','💪','Workout'],['swim10','🏊','10 min swim'],['other','➕','Other']];
      cards[1].innerHTML='<div style="font-size:25px">⚡</div><div class="small" style="font-weight:800;margin-bottom:8px">Movement</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'+opts.map(x=>'<button class="btn '+(choice===x[0]?'good':'secondary')+' sm" onclick="chooseWorkoutType(\''+x[0]+'\')">'+(choice===x[0]?'✓ ':'')+x[1]+' '+x[2]+'</button>').join('')+'</div><div class="small" style="margin-top:7px">'+(choice?(choice==='other'?(other||'Other'):(choice==='kayaking'?'Kayaking':choice==='workout'?'Workout':'10 min swimming')):'Choose one today')+'</div>';
    }

    function draw(){drawGambling();drawAnchors();}
    draw();setTimeout(draw,250);
  };
  app.addEventListener('load',()=>setTimeout(inject,80));
  setTimeout(inject,150);
}
shell.addEventListener('load',()=>{setTimeout(install,80);setTimeout(install,450)});
</script>
</body>
</html>
