<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>Project 0 → 100</title>
<style>html,body{margin:0;width:100%;height:100%;background:#090b0f;overflow:hidden}#shell{display:block;width:100%;height:100dvh;border:0;background:#090b0f}</style>
</head>
<body>
<iframe id="shell" src="/index.html?embedded=1" title="Project 0 → 100"></iframe>
<script>
const shell=document.getElementById('shell');
function install(){
  const outer=shell.contentDocument;if(!outer)return;
  const app=outer.getElementById('app');if(!app)return;
  const inject=()=>{
    const d=app.contentDocument,w=app.contentWindow;if(!d||!w||!w.data)return;
    w.data.streakCheckins=w.data.streakCheckins||{};
    const today=w.iso();w.data.streakCheckins[today]=w.data.streakCheckins[today]||{};
    w.undoDailyStreak=function(track){
      const t=w.iso();w.data.streakCheckins[t]=w.data.streakCheckins[t]||{};
      if(!w.data.streakCheckins[t][track])return;
      w.data.streakCheckins[t][track]=false;
      w.data[track]=Math.max(0,Number(w.data[track]||0)-1);
      w.save();
    };
    w.resetGamblingStreak=function(){
      if(!w.confirm('Reset your gambling-free streak to 0?'))return;
      w.data.gambling=0;
      const t=w.iso();w.data.streakCheckins[t]=w.data.streakCheckins[t]||{};
      w.data.streakCheckins[t].gambling=false;
      w.save();
    };
    function draw(){
      const days=d.getElementById('gambleDays');if(!days)return;
      const card=days.closest('.card');if(!card)return;
      let box=d.getElementById('gamblingQuickControls');
      if(!box){box=d.createElement('div');box.id='gamblingQuickControls';card.appendChild(box);}
      const protectedToday=!!((w.data.streakCheckins[w.iso()]||{}).gambling);
      box.innerHTML='<div style="font-size:11px;margin-top:9px;font-weight:800;color:'+(protectedToday?'#63e6a6':'#97a1ad')+'">'+(protectedToday?'Today: ✅ Protected':'Today: not checked in')+'</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">'+
      '<button class="btn '+(protectedToday?'good':'secondary')+' sm" onclick="completeDailyStreak(\'gambling\')">'+(protectedToday?'✓ Added today':'✅ Gambling-Free Today')+'</button>'+
      '<button class="btn ghost sm" onclick="undoDailyStreak(\'gambling\')">↩ Undo Today</button></div>'+
      '<button class="btn ghost sm" style="width:100%;margin-top:6px;font-size:10px" onclick="resetGamblingStreak()">Reset streak</button>';
    }
    const oldRender=w.render;
    if(!w.__gamblingControlsWrapped){w.render=function(){oldRender();draw();};w.__gamblingControlsWrapped=true;}
    draw();
  };
  app.addEventListener('load',()=>setTimeout(inject,50));
  setTimeout(inject,100);
}
shell.addEventListener('load',()=>{setTimeout(install,50);setTimeout(install,350)});
</script>
</body>
</html>
