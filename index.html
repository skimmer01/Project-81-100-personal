<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>Project 0 → 100</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#090b0f;overflow:hidden}#app{display:block;width:100%;height:100dvh;border:0;background:#090b0f}
</style>
</head>
<body>
<iframe id="app" src="app.html" title="Project 0 → 100"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow;
  const d=frame.contentDocument;
  if(!d||!w)return;

  const style=d.createElement('style');
  style.textContent=`
    .photo-goal{
      position:relative!important;
      overflow:hidden!important;
      min-height:410px!important;
      display:flex!important;
      flex-direction:column!important;
      justify-content:flex-end!important;
      background:linear-gradient(180deg,rgba(4,10,16,.03) 10%,rgba(4,10,16,.20) 40%,rgba(6,10,15,.68) 68%,rgba(7,10,15,.97) 90%),url('freedive.jpg') center 44%/cover no-repeat!important;
      border-color:#28657c!important;
      box-shadow:inset 0 -110px 120px rgba(0,0,0,.28)!important;
    }
    .photo-goal>*{position:relative;z-index:1}
    .photo-goal .label{color:#d4f7ff!important}
    .photo-goal .big{text-shadow:0 2px 15px #000}
    .photo-goal .small{color:#edf7fb!important;text-shadow:0 1px 9px #000}
    .photo-goal input{background:rgba(5,11,17,.84)!important;backdrop-filter:blur(6px)}
    .movement-card{background:linear-gradient(145deg,rgba(18,28,36,.98),rgba(13,17,22,.98));border-color:#31515f!important}
    .movement-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .movement-btn{min-height:92px;padding:10px 6px!important;background:#10161d!important;color:#f5f7fa!important;border:1px solid #313b46!important;border-radius:15px!important}
    .movement-btn .move-emoji{display:block;font-size:25px;margin-bottom:5px}
    .movement-btn .move-name{display:block;font-size:12px;font-weight:850;line-height:1.15}
    .movement-btn .move-time{display:block;font-size:10px;color:#97a1ad;margin-top:4px}
    .movement-btn.complete{background:#173522!important;border-color:#3d8b61!important;color:#d7ffe6!important}
    .movement-progress{margin-top:10px;font-size:12px;color:#aeb8c4;text-align:center}
    .fortune-overlay{position:fixed;inset:0;z-index:9999;background:rgba(3,6,9,.82);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:22px}
    .fortune-box{width:min(440px,100%);background:linear-gradient(145deg,#18130e,#241a10);border:1px solid #765c32;border-radius:28px;padding:25px 20px 20px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.55)}
    .fortune-box.golden{background:linear-gradient(145deg,#30230d,#17110a);border-color:#d6aa4d;box-shadow:0 0 0 1px rgba(246,198,93,.22),0 24px 80px rgba(0,0,0,.62)}
    .cookie{font-size:64px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35));margin-bottom:8px}
    .fortune-kicker{font-size:11px;letter-spacing:.18em;color:#d2ae6b;text-transform:uppercase}
    .fortune-title{font-size:24px;font-weight:900;margin:7px 0 12px}
    .fortune-slip{background:#fff9e8;color:#272019;border-radius:10px;padding:17px 14px;font-family:Georgia,serif;font-size:18px;line-height:1.35;box-shadow:inset 0 0 0 1px #e1d4af}
    .fortune-close{margin-top:15px;width:100%}
    @media(max-width:420px){.photo-goal{min-height:390px!important}.movement-grid{gap:6px}.movement-btn{min-height:88px;padding:9px 4px!important}.fortune-title{font-size:21px}}
  `;
  d.head.appendChild(style);

  const note=d.querySelector('.photo-goal .small');
  if(note)note.textContent='81 ft achieved. 100 ft • 2027. Inspiration, not another daily obligation.';

  const enhancement=d.createElement('script');
  enhancement.textContent=`
  (()=>{
    const MOVES=[
      {id:'handstands',emoji:'🤸',name:'Handstands',time:'10 min'},
      {id:'workout',emoji:'💪',name:'Workout',time:'60 min'},
      {id:'kayak',emoji:'🛶',name:'Kayaking Trip',time:'counts'}
    ];
    const MILESTONES=[7,14,30,60,100,365];
    const fortunes={
      gambling:[
        'You didn’t get lucky. You got disciplined.',
        'The win was walking away. Keep stacking those wins.',
        'Your future gets stronger every time you refuse the old pattern.',
        'You kept your money, your time, and your momentum. That is the jackpot.'
      ],
      spend:[
        'Every dollar you don’t waste gets assigned a better job.',
        'Financial peace is built one boring good decision at a time.',
        'You are buying freedom instead of dopamine.'
      ],
      food:[
        'You don’t need perfect meals. You need enough good days stacked together.',
        'Fuel the body that has to carry the life you’re building.',
        'Consistency tastes better than regret.'
      ],
      training:[
        'Motivation is optional now. This is becoming who you are.',
        'Strong days stack into a strong life.',
        'You showed up. Your body remembers that.'
      ],
      wolfie:[
        'Wolfie got the walk. You got the reset. Everybody wins. 🐺',
        'A good life is built in small rituals — sometimes with a leash in your hand.',
        'You showed up for Wolfie again. That counts for more than a checkbox.'
      ],
      missions:[
        'You kept the day winnable — and then you won it.',
        'Three important things beat thirty half-finished things.',
        'Execution is a superpower. Keep it simple.'
      ]
    };
    const labels={gambling:'Gambling-Free',spend:'No-Spend',food:'Clean Eating',training:'Movement',wolfie:'Walk Wolfie',missions:'Daily Missions'};

    data.movementByDate=data.movementByDate||{};
    data.rewardClaims=data.rewardClaims||{};

    function movement(d){return data.movementByDate[d]||(data.movementByDate[d]={});}
    function movementCount(d){return Object.values(movement(d)).filter(Boolean).length;}
    function movementSummary(d){
      const picked=MOVES.filter(x=>movement(d)[x.id]);
      return picked.length?picked.map(x=>x.name).join(' + '):'Choose what counts today';
    }
    window.setMovement=function(d,id){
      const m=movement(d),before=movementCount(d),a=anchors(d);
      m[id]=!m[id];
      const after=movementCount(d);
      if(after>0&&!a.workout){a.workout=true;if(d===iso())data.training++;}
      if(after===0)a.workout=false;
      save();
      if(after>before)checkRewards();
    };
    window.openMovement=function(d){
      if(d!==selected){selected=d;cursor=new Date(d+'T12:00:00');}
      if(d===iso())goView('homeView');else goView('dayView');
      setTimeout(()=>{
        const el=document.getElementById(d===iso()?'movementCardHome':'movementCardDay');
        if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
      },40);
    };
    function movementCard(d,id){
      const count=movementCount(d),a=anchors(d);
      return '<div class="card movement-card" id="'+id+'"><div class="row"><div><div class="label">Today’s Movement</div><div class="med">'+(count?'Goal complete ✓':'Choose one')+'</div><div class="small">'+movementSummary(d)+'</div></div><div class="badge">'+count+'/3</div></div><div class="movement-grid">'+MOVES.map(x=>'<button class="btn movement-btn '+(movement(d)[x.id]?'complete':'')+'" onclick="setMovement(\''+d+'\',\''+x.id+'\')"><span class="move-emoji">'+x.emoji+'</span><span class="move-name">'+x.name+'</span><span class="move-time">'+x.time+'</span></button>').join('')+'</div><div class="movement-progress">1 choice protects the Movement streak • do more if you want a monster day.</div></div>';
    }
    function injectMovementCards(){
      const homeAnchor=document.getElementById('anchorGrid');
      if(homeAnchor){const homeCard=homeAnchor.closest('.card');let slot=document.getElementById('movementSlotHome');if(!slot){slot=document.createElement('div');slot.id='movementSlotHome';homeCard.insertAdjacentElement('afterend',slot);}slot.innerHTML=movementCard(iso(),'movementCardHome');}
      const dayAnchor=document.getElementById('anchorGridDay');
      if(dayAnchor){const dayCard=dayAnchor.closest('.card');let slot=document.getElementById('movementSlotDay');if(!slot){slot=document.createElement('div');slot.id='movementSlotDay';dayCard.insertAdjacentElement('beforebegin',slot);}slot.innerHTML=movementCard(selected,'movementCardDay');}
    }

    anchorHTML=function(a,d){
      const items=[['wolfie','🐺','Walk Wolfie'],['workout','⚡','Movement'],['nutrition','🥗','Nutrition check-in']];
      return items.map(x=>{
        const status=x[0]==='workout'?(movementCount(d)?movementSummary(d):'Choose activity'):x[2];
        const action=x[0]==='workout'?"openMovement('"+d+"')":"toggleAnchor('"+d+"','"+x[0]+"')";
        const button=x[0]==='workout'?(a.workout?'✓ Done':'Choose'): (a[x[0]]?'✓ Done':'Mark done');
        return '<div class="anchor"><div style="font-size:25px">'+x[1]+'</div><div class="small">'+status+'</div><button class="btn '+(a[x[0]]?'good':'secondary')+' sm" onclick="'+action+'">'+button+'</button></div>';
      }).join('');
    };

    function dayBefore(date,n){const x=new Date(date+'T12:00:00');x.setDate(x.getDate()-n);return iso(x);}
    function anchorStreak(key){let s=0;for(let i=0;i<500;i++){const dd=dayBefore(iso(),i),a=data.anchorsByDate[dd];if(a&&a[key])s++;else if(i===0)continue;else break;}return s;}
    function missionStreak(){let s=0;for(let i=0;i<500;i++){const dd=dayBefore(iso(),i),m=data.missionsByDate[dd];const won=m&&m.length&&m.every(x=>x.done);if(won)s++;else if(i===0)continue;else break;}return s;}
    function trackValues(){return{gambling:Number(data.gambling||0),spend:Number(data.spend||0),food:Number(data.food||0),training:Number(data.training||0),wolfie:anchorStreak('wolfie'),missions:missionStreak()};}
    function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
    function showFortune(track,days){
      const golden=Math.random()<.12;
      const overlay=document.createElement('div');overlay.className='fortune-overlay';overlay.id='fortuneOverlay';
      overlay.innerHTML='<div class="fortune-box '+(golden?'golden':'')+'"><div class="cookie">'+(golden?'✨🥠✨':'🥠')+'</div><div class="fortune-kicker">'+(golden?'Rare Golden Fortune':'Streak Reward')+'</div><div class="fortune-title">'+days+' Days • '+labels[track]+'</div><div class="fortune-slip">“'+pick(fortunes[track])+'”</div><button class="btn primary fortune-close" onclick="document.getElementById(\'fortuneOverlay\').remove()">Keep going →</button></div>';
      document.body.appendChild(overlay);
    }
    window.checkRewards=function(){
      if(document.getElementById('fortuneOverlay'))return;
      const vals=trackValues();
      for(const track of Object.keys(vals)){
        for(const days of MILESTONES){
          const key=track+'_'+days;
          if(vals[track]>=days&&!data.rewardClaims[key]){
            data.rewardClaims[key]=new Date().toISOString();
            localStorage.setItem(KEY,JSON.stringify(data));
            showFortune(track,days);
            return;
          }
        }
      }
    };

    const originalRender=render;
    render=function(){originalRender();injectMovementCards();setTimeout(checkRewards,0);};
    injectMovementCards();
    setTimeout(checkRewards,250);
  })();
  `;
  d.body.appendChild(enhancement);
});
</script>
</body>
</html>
