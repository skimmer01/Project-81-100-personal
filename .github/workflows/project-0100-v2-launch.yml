name: Project 0-100 V2 Launch
'on':
  push:
    paths:
      - .github/workflows/project-0100-v2-launch.yml
permissions:
  contents: write
jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V2
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          s=s.replace('<title>Project 0 → 100</title>','<title>Project 0 → 100 — V2</title>',1)
          old="<div class=\"kicker\">PROJECT</div><h1>0 → 100</h1><div class=\"sub\">Build the life you don't need to escape from.</div>"
          new="<div class=\"kicker\">PROJECT • V2</div><h1>0 → 100</h1><div class=\"sub\">Build the life you don't need to escape from.</div><div class=\"card\" style=\"background:linear-gradient(135deg,rgba(39,211,239,.10),rgba(99,230,166,.05))\"><div class=\"label\">TODAY'S MOMENTUM</div><div class=\"med\" id=\"momentumMessage\">One good decision creates the next one.</div><div class=\"small\" style=\"margin-top:7px\">Progress over perfection. Comebacks count.</div></div>"
          if old not in s: raise SystemExit('hero target missing')
          s=s.replace(old,new,1)
          marker='<div class="card"><div class="label">Noom-ish Daily Check-In</div>'
          records='''<div class="card"><div class="row"><div><div class="label">🏆 PERSONAL RECORDS</div><div class="small">Proof of what you are capable of.</div></div><button class="btn ghost sm" onclick="toggleRecords()">Manage</button></div><div id="recordList" style="margin-top:10px"></div><div class="panel" id="recordPanel"><div class="stack"><input id="recordName" placeholder="Record — e.g. Handstand"><input id="recordValue" placeholder="Best — e.g. 45 sec"><input id="recordGoal" placeholder="Next goal — optional"><button class="btn primary" onclick="addRecord()">+ Add Record</button></div></div></div>'''
          if marker not in s: raise SystemExit('records marker missing')
          s=s.replace(marker,records+marker,1)
          target='workoutHistory:[],debts:'
          if target not in s: raise SystemExit('data target missing')
          s=s.replace(target,"workoutHistory:[],records:[{name:'Freedive',value:'81 ft',goal:'100 ft'},{name:'Bench Press',value:'275 lb × 1',goal:'300 lb'}],comebacks:0,debts:",1)
          old='function render(){renderHome();renderMissions();renderAnchors();renderCalendar();renderPile();renderVov();renderLeads();renderDebt();renderWorkout();renderNutrition();renderMore()}'
          new='function render(){renderHome();renderMissions();renderAnchors();renderCalendar();renderPile();renderVov();renderLeads();renderDebt();renderWorkout();renderRecords();renderNutrition();renderMore()}'
          if old not in s: raise SystemExit('render target missing')
          s=s.replace(old,new,1)
          insert="""function renderRecords(){if(!data.records)data.records=[];let el=$('recordList');if(!el)return;el.innerHTML=data.records.length?data.records.map((r,i)=>`<div class=\"exercise\"><div class=\"row\"><div><div class=\"small\">${esc(r.name)}</div><div class=\"med\">${esc(r.value)}</div>${r.goal?`<div class=\"small\">Next: ${esc(r.goal)}</div>`:''}</div><button class=\"btn ghost sm\" onclick=\"deleteRecord(${i})\">×</button></div></div>`).join(''):'<div class=\"small\">Add something you want to beat.</div>'}function toggleRecords(){let p=$('recordPanel');if(p)p.classList.toggle('show')}function addRecord(){let n=$('recordName').value.trim(),v=$('recordValue').value.trim(),g=$('recordGoal').value.trim();if(!n||!v)return;data.records=data.records||[];data.records.push({name:n,value:v,goal:g});$('recordName').value='';$('recordValue').value='';$('recordGoal').value='';save()}function deleteRecord(i){data.records.splice(i,1);save()}
"""
          target='function renderNutrition()'
          if target not in s: raise SystemExit('nutrition function missing')
          s=s.replace(target,insert+target,1)
          p.write_text(s)
          PY
      - name: Commit V2
        shell: bash
        run: |
          git config user.name "Project 0-100 Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app.html
          git commit -m "Launch Project 0 to 100 V2"
          git push
